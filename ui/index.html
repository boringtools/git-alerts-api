<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GitAlerts - Discover and track exposed secrets and security findings in GitHub repositories" />
    <meta name="theme-color" content="#3b82f6" />
    <title>GitAlerts - Security Findings Tracker</title>
    <script>
      // Apply the saved theme before first paint so a dark session never flashes white.
      // Keep this in sync with ui/src/lib/theme.ts (same key, same resolution rules).
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var followsSystem = stored === null || stored === 'system';
          var dark = stored === 'dark' ||
            (followsSystem && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {
          /* storage blocked: fall through to the light palette */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
